# Sign the private Unity iOS Xcode export and optionally upload to TestFlight.
# Public repo: never commit the tarball or signing material.
# upload_to_testflight defaults off. Scott approved a one-time upload of
# build 203 to internal TestFlight (himself only) once this workflow is
# dispatched with the input set true.
#
# Team NGK9AFWK5C, bundle com.swlm.cutline, marketing 2.0.2, build 203.
# The export is hosted at the unguessable IOS_EXPORT_URL secret (Cloudflare
# Worker). IOS_EXPORT_GITHUB_TOKEN may stay empty. Download with curl.
# sha256 62e91ec7032243818f6f8216509d72edfc7db56fb99ef579b21c93511a5b74dc
#
# Runner: macos-26-intel (free unlimited standard runner on this public repo).
# Recheck Xcode at run time. Default 26.6 as of runner-images 20260824.0517.1.
#
# 2026-11-10: run 42767054659 failed at archive (exit 65) with
#   "Unity-iPhone" requires a provisioning profile.
# The p12 and profile imported, but xcodebuild was not given a distribution
# identity or the app-target profile specifier. Unity-iPhone reads
# PROVISIONING_PROFILE_APP / PROVISIONING_PROFILE_SPECIFIER_APP, and ships
# with CODE_SIGN_IDENTITY=iPhone Developer. Do not set a global
# PROVISIONING_PROFILE_SPECIFIER — UnityFramework and GameAssembly must
# not receive the App Store app profile.

name: Sign existing iOS Xcode export

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload the IPA to App Store Connect (needs Scott's written go)"
        type: boolean
        default: false
      ios_build_number:
        description: "CFBundleVersion / CURRENT_PROJECT_VERSION. Must be > 202."
        type: string
        default: "203"
      xcode_path:
        description: "Xcode.app to select on the runner"
        type: string
        default: /Applications/Xcode_26.6.app

permissions:
  contents: read

jobs:
  sign:
    name: Archive Unity-iPhone (no Unity rebuild)
    runs-on: macos-26-intel
    timeout-minutes: 180
    env:
      BUNDLE_ID: com.swlm.cutline
      SCHEME: Unity-iPhone
      MARKETING_VERSION: "2.0.2"
      APPLE_TEAM_ID: NGK9AFWK5C
    steps:
      - name: Refuse a checkout of the Unity tree
        run: echo "No actions/checkout. The public repo is not the export source."

      - name: Select Xcode 26 and prove the SDK
        run: |
          set -euo pipefail
          sudo xcode-select -s "${{ inputs.xcode_path }}"
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          sw_vers
          df -h

      - name: Download and verify the private iOS export tarball
        env:
          IOS_EXPORT_URL: ${{ secrets.IOS_EXPORT_URL }}
          IOS_EXPORT_SHA256: ${{ secrets.IOS_EXPORT_SHA256 }}
          IOS_EXPORT_GITHUB_TOKEN: ${{ secrets.IOS_EXPORT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${IOS_EXPORT_URL}" ] || [ -z "${IOS_EXPORT_SHA256}" ]; then
            echo "IOS_EXPORT_URL and IOS_EXPORT_SHA256 secrets must be set." >&2
            exit 1
          fi
          if [ -n "${IOS_EXPORT_GITHUB_TOKEN}" ]; then
            curl -L --fail \
              -H "Authorization: Bearer ${IOS_EXPORT_GITHUB_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o export.tar.gz \
              "$IOS_EXPORT_URL"
          else
            curl -L --fail -o export.tar.gz "$IOS_EXPORT_URL"
          fi
          actual=$(shasum -a 256 export.tar.gz | awk '{print $1}')
          echo "sha256 $actual"
          if [ "$actual" != "$IOS_EXPORT_SHA256" ]; then
            echo "Refusing to sign: tarball hash does not match IOS_EXPORT_SHA256" >&2
            exit 1
          fi
          mkdir -p export
          tar -xzf export.tar.gz -C export
          rm -f export.tar.gz
          found=$(find export -name Unity-iPhone.xcodeproj -type d | head -n 1 || true)
          if [ -z "$found" ]; then
            echo "Unity-iPhone.xcodeproj not found in the tarball" >&2
            find export -maxdepth 3 -type d >&2
            exit 1
          fi
          echo "PROJECT_DIR=$(cd "$(dirname "$found")" && pwd)" >> "$GITHUB_ENV"

      - name: Import signing material into a temporary keychain
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${IOS_DISTRIBUTION_P12}" ] || [ -z "${IOS_PROFILE_BASE64}" ]; then
            echo "IOS_DISTRIBUTION_P12 / IOS_PROFILE_BASE64 secrets are not set." >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/skiview-signing.keychain-db"
          PASS="$(openssl rand -base64 32)"
          umask 077
          printf '%s' "$PASS" > "$RUNNER_TEMP/keychain-pass"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          echo "$IOS_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          security find-identity -v -p codesigning "$KEYCHAIN"
          PROFILE_RAW="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$PROFILE_RAW"
          security cms -D -i "$PROFILE_RAW" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          if [ -z "$PROFILE_UUID" ] || [ -z "$PROFILE_NAME" ]; then
            echo "Could not read UUID/Name from the provisioning profile" >&2
            exit 1
          fi
          echo "Installed profile name=$PROFILE_NAME uuid=$PROFILE_UUID"
          # Xcode 16+ reads UserData; keep the legacy path too.
          DEST1="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          DEST2="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST1" "$DEST2"
          cp "$PROFILE_RAW" "$DEST1/${PROFILE_UUID}.mobileprovision"
          cp "$PROFILE_RAW" "$DEST2/${PROFILE_UUID}.mobileprovision"
          rm -f "$RUNNER_TEMP/dist.p12" "$PROFILE_RAW" "$RUNNER_TEMP/profile.plist"
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN"
            echo "KEYCHAIN_PASS_FILE=$RUNNER_TEMP/keychain-pass"
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
          } >> "$GITHUB_ENV"

      - name: Write ExportOptions.plist
        run: |
          set -euo pipefail
          if [ -z "${PROFILE_NAME:-}" ]; then
            echo "PROFILE_NAME was not set by the import step" >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>testFlightInternalTestingOnly</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>iPhone Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Archive and export IPA at build 203 or higher
        env:
          IOS_BUILD_NUMBER: ${{ inputs.ios_build_number }}
        run: |
          set -euo pipefail
          case "$IOS_BUILD_NUMBER" in
            ''|*[!0-9]*) echo "ios_build_number must be an integer" >&2; exit 1 ;;
          esac
          if [ "$IOS_BUILD_NUMBER" -le 202 ]; then
            echo "ios_build_number must be greater than 202 (got $IOS_BUILD_NUMBER)" >&2
            exit 1
          fi
          if [ -z "${PROFILE_UUID:-}" ] || [ -z "${PROFILE_NAME:-}" ]; then
            echo "PROFILE_UUID / PROFILE_NAME were not set by the import step" >&2
            exit 1
          fi
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "${KEYCHAIN_PASS_FILE:-}" ]; then
            security unlock-keychain -p "$(cat "$KEYCHAIN_PASS_FILE")" "$KEYCHAIN_PATH"
          fi
          cd "$PROJECT_DIR"
          xcodebuild -list
          mkdir -p "$RUNNER_TEMP/out"
          # Unity-iPhone binds the profile through *_APP vars. Do not pass a
          # global PROVISIONING_PROFILE_SPECIFIER (it would be applied to
          # UnityFramework / GameAssembly, which cannot use this app profile).
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/out/SkiView.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            "CODE_SIGN_IDENTITY[sdk=iphoneos*]=iPhone Distribution" \
            PROVISIONING_PROFILE_APP="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER_APP="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/out/SkiView.xcarchive" \
            -exportPath "$RUNNER_TEMP/out/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/out/ipa"
          rm -rf "$RUNNER_TEMP/out/SkiView.xcarchive"

      - name: Upload IPA to App Store Connect (gated)
        if: ${{ inputs.upload_to_testflight }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${APP_STORE_CONNECT_KEY_ID}" ] || [ -z "${APP_STORE_CONNECT_ISSUER_ID}" ] || [ -z "${APP_STORE_CONNECT_API_KEY_P8}" ]; then
            echo "App Store Connect API secrets are not set" >&2
            exit 1
          fi
          echo "upload_to_testflight is true. Uploading because the workflow input was set."
          umask 077
          KEY="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY"
          IPA=$(ls "$RUNNER_TEMP/out/ipa"/*.ipa)
          mkdir -p "$RUNNER_TEMP/private_keys"
          ln -sf "$KEY" "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          (cd "$RUNNER_TEMP" && xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID")
          rm -f "$KEY" "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Skip upload (default)
        if: ${{ !inputs.upload_to_testflight }}
        run: echo "IPA exported on the runner. Upload skipped (default). Nothing was sent to Apple."

      - name: Clean keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "${KEYCHAIN_PASS_FILE:-}"
